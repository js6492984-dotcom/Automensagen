name: Gerar APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android
        uses: android-actions/setup-android@v3

      - name: Instalar SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Criar projeto Android
        run: |
          rm -rf AndroidApp

          mkdir -p AndroidApp/app/src/main/java/com/automensagen/kachi
          mkdir -p AndroidApp/app/src/main/res/values
          mkdir -p AndroidApp/app/src/main/res/xml

          cd AndroidApp

          printf '%s\n' \
          'pluginManagement {' \
          '    repositories {' \
          '        google()' \
          '        mavenCentral()' \
          '        gradlePluginPortal()' \
          '    }' \
          '}' \
          '' \
          'dependencyResolutionManagement {' \
          '    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)' \
          '    repositories {' \
          '        google()' \
          '        mavenCentral()' \
          '    }' \
          '}' \
          '' \
          'rootProject.name = "Automensagen"' \
          'include ":app"' \
          > settings.gradle

          printf '%s\n' \
          'plugins {' \
          '    id '\''com.android.application'\'' version '\''8.7.3'\'' apply false' \
          '}' \
          > build.gradle

          printf '%s\n' \
          'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' \
          'android.useAndroidX=true' \
          > gradle.properties

          printf '%s\n' \
          'plugins {' \
          '    id '\''com.android.application'\''' \
          '}' \
          '' \
          'android {' \
          '    namespace '\''com.automensagen.kachi'\''' \
          '    compileSdk 35' \
          '' \
          '    defaultConfig {' \
          '        applicationId '\''com.automensagen.kachi'\''' \
          '        minSdk 23' \
          '        targetSdk 35' \
          '        versionCode 1' \
          '        versionName '\''1.0'\''' \
          '    }' \
          '' \
          '    buildTypes {' \
          '        debug {' \
          '            minifyEnabled false' \
          '        }' \
          '    }' \
          '' \
          '    compileOptions {' \
          '        sourceCompatibility JavaVersion.VERSION_17' \
          '        targetCompatibility JavaVersion.VERSION_17' \
          '    }' \
          '}' \
          > app/build.gradle

          printf '%s\n' \
          '<?xml version="1.0" encoding="utf-8"?>' \
          '<resources>' \
          '    <string name="app_name">Automensagen</string>' \
          '    <string name="accessibility_description">Respostas automaticas</string>' \
          '</resources>' \
          > app/src/main/res/values/strings.xml

          printf '%s\n' \
          '<?xml version="1.0" encoding="utf-8"?>' \
          '<resources>' \
          '    <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">' \
          '        <item name="android:fontFamily">sans</item>' \
          '        <item name="android:colorAccent">#3F51B5</item>' \
          '    </style>' \
          '</resources>' \
          > app/src/main/res/values/themes.xml

          printf '%s\n' \
          '<?xml version="1.0" encoding="utf-8"?>' \
          '<accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"' \
          '    android:accessibilityEventTypes="typeWindowContentChanged|typeWindowStateChanged"' \
          '    android:accessibilityFeedbackType="feedbackGeneric"' \
          '    android:canRetrieveWindowContent="true"' \
          '    android:notificationTimeout="100"' \
          '    android:description="@string/accessibility_description" />' \
          > app/src/main/res/xml/accessibility_service_config.xml

          printf '%s\n' \
          '<?xml version="1.0" encoding="utf-8"?>' \
          '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' \
          '' \
          '    <application' \
          '        android:allowBackup="true"' \
          '        android:label="@string/app_name"' \
          '        android:theme="@style/AppTheme">' \
          '' \
          '        <activity' \
          '            android:name=".MainActivity"' \
          '            android:exported="true">' \
          '' \
          '            <intent-filter>' \
          '                <action android:name="android.intent.action.MAIN" />' \
          '                <category android:name="android.intent.category.LAUNCHER" />' \
          '            </intent-filter>' \
          '' \
          '        </activity>' \
          '' \
          '        <service' \
          '            android:name=".AutoReplyAccessibilityService"' \
          '            android:exported="false"' \
          '            android:label="@string/app_name"' \
          '            android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">' \
          '' \
          '            <intent-filter>' \
          '                <action android:name="android.accessibilityservice.AccessibilityService" />' \
          '            </intent-filter>' \
          '' \
          '            <meta-data' \
          '                android:name="android.accessibilityservice"' \
          '                android:resource="@xml/accessibility_service_config" />' \
          '' \
          '        </service>' \
          '' \
          '    </application>' \
          '' \
          '</manifest>' \
          > app/src/main/AndroidManifest.xml

          printf '%s\n' \
          'package com.automensagen.kachi;' \
          '' \
          'import android.app.Activity;' \
          'import android.os.Bundle;' \
          'import android.content.Intent;' \
          'import android.provider.Settings;' \
          'import android.graphics.Color;' \
          'import android.view.Gravity;' \
          'import android.widget.*;' \
          '' \
          'public class MainActivity extends Activity {' \
          '' \
          '    private EditText resposta;' \
          '    private EditText atraso;' \
          '    private Switch ativado;' \
          '' \
          '    @Override' \
          '    protected void onCreate(Bundle state) {' \
          '        super.onCreate(state);' \
          '' \
          '        LinearLayout layout = new LinearLayout(this);' \
          '        layout.setOrientation(LinearLayout.VERTICAL);' \
          '        layout.setPadding(40,40,40,40);' \
          '' \
          '        ScrollView scroll = new ScrollView(this);' \
          '        scroll.add
