name: Gerar APK Automensagem

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto Android
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Criar projeto Android
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/automensagen
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Automensagem"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.automensagen'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.automensagen'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Automensagem</string>
              <string name="accessibility_description">Automensagem para respostas automáticas</string>
          </resources>
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="24dp">

              <TextView
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Automensagem"
                  android:textSize="26sp"
                  android:textStyle="bold"
                  android:paddingBottom="20dp" />

              <TextView
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Para funcionar, ative o serviço de acessibilidade do Automensagem nas configurações do Android."
                  android:textSize="17sp"
                  android:paddingBottom="25dp" />

              <Button
                  android:id="@+id/btnAcessibilidade"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Ativar acessibilidade" />

          </LinearLayout>
          EOF

          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged|typeViewTextChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="100"
              android:canRetrieveWindowContent="true"
              android:accessibilityFlags="flagDefault|flagReportViewIds"
              android:description="@string/accessibility_description" />
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />

              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".AutoReplyAccessibilityService"
                      android:exported="false"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">

                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>

                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />

                  </service>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/automensagen/MainActivity.java <<'EOF'
          package com.automensagen;

          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.widget.Button;

          public class MainActivity extends Activity {

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  Button botao = findViewById(R.id.btnAcessibilidade);

                  botao.setOnClickListener(v -> {
                      Intent intent = new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS);
                      startActivity(intent);
                  });
              }
          }
          EOF

          cat > app/src/main/java/com/automensagen/AutoReplyAccessibilityService.java <<'EOF'
          package com.automensagen;

          import android.accessibilityservice.AccessibilityService;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;

          import java.util.List;
          import java.util.Locale;

          public class AutoReplyAccessibilityService extends AccessibilityService {

              private final Handler handler = new Handler(Looper.getMainLooper());
              private boolean processando = false;
              private long ultimaResposta = 0;

              private static final long INTERVALO = 2500;

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {

                  if (event == null) {
                      return;
                  }

                  CharSequence pacote = event.getPackageName();

                  if (pacote == null) {
                      return;
                  }

                  String nomePacote = pacote.toString().toLowerCase(Locale.ROOT);

                  /*
                   * O serviço trabalha somente quando o aplicativo em primeiro
                   * plano possui "kachi" no nome do pacote.
                   */
                  if (!nomePacote.contains("kachi")) {
                      return;
                  }

                  if (processando) {
                      return;
                  }

                  long agora = System.currentTimeMillis();

                  if (agora - ultimaResposta < INTERVALO) {
                      return;
                  }

                  AccessibilityNodeInfo raiz = getRootInActiveWindow();

                  if (raiz == null) {
                      return;
                  }

                  procurarMensagem(raiz);
              }

              private void procurarMensagem(AccessibilityNodeInfo raiz) {

                  List<AccessibilityNodeInfo> encontrados =
                          raiz.findAccessibilityNodeInfosByText("oi");

                  if (encontrados == null || encontrados.isEmpty()) {
                      return;
                  }

                  for (AccessibilityNodeInfo no : encontrados) {

                      if (no == null) {
                          continue;
                      }

                      CharSequence texto = no.getText();

                      if (texto == null) {
                          continue;
                      }

                      String mensagem =
                              texto.toString().trim().toLowerCase(Locale.ROOT);

                      if (!mensagem.equals("oi")) {
                          continue;
                      }

                      responder(raiz);
                      return;
                  }
              }

              private void responder(AccessibilityNodeInfo raiz) {

                  if (processando) {
                      return;
                  }

                  processando = true;

                  /*
                   * Primeiro procura um campo editável para colocar a resposta.
                   */
                  AccessibilityNodeInfo campo =
                          encontrarCampoEditavel(raiz);

                  if (campo == null) {
                      processando = false;
                      return;
                  }

                  String resposta = "Olá! Como posso ajudar?";

                  campo.performAction(
                          AccessibilityNodeInfo.ACTION_FOCUS
                  );

                  campo.performAction(
                          AccessibilityNodeInfo.ACTION_SET_TEXT,
                          criarTexto(resposta)
                  );

                  /*
                   * Aguarda o Kachi atualizar a tela e então procura
                   * explicitamente o botão de envio.
                   */
                  handler.postDelayed(() -> {

                      AccessibilityNodeInfo novaRaiz =
                              getRootInActiveWindow();

                      if (novaRaiz != null) {
                          clicarEnviar(novaRaiz);
                      }

                      ultimaResposta = System.currentTimeMillis();
                      processando = false;

                  }, 350);
              }

              private AccessibilityNodeInfo encontrarCampoEditavel(
                      AccessibilityNodeInfo no) {

                  if (no == null) {
                      return null;
                  }

                  if (no.isEditable()) {
                      return no;
                  }

                  for (int i = 0; i < no.getChildCount(); i++) {

                      AccessibilityNodeInfo filho = no.getChild(i);

                      AccessibilityNodeInfo resultado =
                              encontrarCampoEditavel(filho);

                      if (resultado != null) {
                          return resultado;
                      }
                  }

                  return null;
              }

              private void clicarEnviar(AccessibilityNodeInfo raiz) {

                  /*
                   * Primeira tentativa:
                   * procura o texto "Enviar".
                   */
                  List<AccessibilityNodeInfo> botoes =
                          raiz.findAccessibilityNodeInfosByText("Enviar");

                  if (botoes != null) {

                      for (AccessibilityNodeInfo botao : botoes) {

                          if (botao == null) {
                              continue;
                          }

                          if (botao.isClickable()) {
                              botao.performAction(
                                      AccessibilityNodeInfo.ACTION_CLICK
                              );
                              return;
                          }

                          AccessibilityNodeInfo clicavel =
                                  encontrarPaiClicavel(botao);

                          if (clicavel != null) {
                              clicavel.performAction(
                                      AccessibilityNodeInfo.ACTION_CLICK
                              );
                              return;
                          }
                      }
                  }

                  /*
                   * Segunda tentativa:
                   * procura por "Enviar" em content-description.
                   */
                  AccessibilityNodeInfo botaoDescricao =
                          encontrarPorDescricao(raiz, "enviar");

                  if (botaoDescricao != null) {

                      if (botaoDescricao.isClickable()) {
                          botaoDescricao.performAction(
                                  AccessibilityNodeInfo.ACTION_CLICK
                          );
                          return;
                      }

                      AccessibilityNodeInfo pai =
                              encontrarPaiClicavel(botaoDescricao);

                      if (pai != null) {
                          pai.performAction(
                                  AccessibilityNodeInfo.ACTION_CLICK
                          );
                      }
                  }
              }

              private AccessibilityNodeInfo encontrarPorDescricao(
                      AccessibilityNodeInfo no,
                      String procurado) {

                  if (no == null) {
                      return null;
                  }

                  CharSequence descricao = no.getContentDescription();

                  if (descricao != null &&
                          descricao.toString()
                                  .toLowerCase(Locale.ROOT)
                                  .contains(procurado)) {

                      return no;
                  }

                  for (int i = 0; i < no.getChildCount(); i++) {

                      AccessibilityNodeInfo filho = no.getChild(i);

                      AccessibilityNodeInfo resultado =
                              encontrarPorDescricao(filho, procurado);

                      if (resultado != null) {
                          return resultado;
                      }
                  }

                  return null;
              }

              private AccessibilityNodeInfo encontrarPaiClicavel(
                      AccessibilityNodeInfo no) {

                  AccessibilityNodeInfo atual = no;

                  for (int i = 0; i < 6 && atual != null; i++) {

                      if (atual.isClickable()) {
                          return atual;
                      }

                      atual = atual.getParent();
                  }

                  return null;
              }

              private android.os.Bundle criarTexto(String texto) {

                  android.os.Bundle argumentos = new android.os.Bundle();

                  argumentos.putCharSequence(
                          AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE,
                          texto
                  );

                  return argumentos;
              }

              @Override
              public void onInterrupt() {
                  processando = false;
              }
          }
          EOF

      - name: Instalar componentes do Android SDK
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Instalar Gradle
        shell: bash
        run: |
          set -e

          curl -L \
            -o gradle.zip \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip

          unzip -q gradle.zip

          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Compilar APK
        shell: bash
        run: |
          set -e

          gradle --version

          gradle \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Automensagem-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
