name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1 - Baixar o repositório
      # ==========================================================
      - name: Baixar código
        uses: actions/checkout@v4


      # ==========================================================
      # 2 - Java 17
      # ==========================================================
      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================================
      # 3 - Localizar Android SDK
      # ==========================================================
      - name: Configurar Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ -z "$ANDROID_HOME" ]; then
            export ANDROID_HOME="$HOME/android-sdk"
          fi

          if [ -z "$ANDROID_SDK_ROOT" ]; then
            export ANDROID_SDK_ROOT="$ANDROID_HOME"
          fi

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          mkdir -p "$ANDROID_HOME"


      # ==========================================================
      # 4 - Encontrar sdkmanager
      # ==========================================================
      - name: Encontrar sdkmanager
        shell: bash
        run: |
          SDKMANAGER=""

          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi

          if [ -z "$SDKMANAGER" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -name sdkmanager \
              2>/dev/null | head -n 1 || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT" \
              -type f \
              -name sdkmanager \
              2>/dev/null | head -n 1 || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager não foi encontrado."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          "$SDKMANAGER" --version


      # ==========================================================
      # 5 - Aceitar licenças
      # ==========================================================
      - name: Aceitar licenças do Android
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses || true


      # ==========================================================
      # 6 - Instalar Android SDK necessário
      # ==========================================================
      - name: Instalar Android SDK
        shell: bash
        run: |
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "SDK instalado."


      # ==========================================================
      # 7 - Verificar SDK
      # ==========================================================
      - name: Verificar Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          "$SDKMANAGER" --list | head -n 30

          echo "Verificação concluída."


      # ==========================================================
      # 8 - Criar estrutura Android
      # ==========================================================
      - name: Criar estrutura do projeto
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/automensagem
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values


      # ==========================================================
      # 9 - settings.gradle
      # ==========================================================
      - name: Criar settings.gradle
        shell: bash
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Automensagem"
          include(":app")
          EOF


      # ==========================================================
      # 10 - build.gradle principal
      # ==========================================================
      - name: Criar build.gradle
        shell: bash
        run: |
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF


      # ==========================================================
      # 11 - gradle.properties
      # ==========================================================
      - name: Criar gradle.properties
        shell: bash
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF


      # ==========================================================
      # 12 - build.gradle do aplicativo
      # ==========================================================
      - name: Criar configuração do aplicativo
        shell: bash
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.automensagem'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.automensagem'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.15.0'
              implementation 'androidx.appcompat:appcompat:1.7.0'
          }
          EOF


      # ==========================================================
      # 13 - ProGuard
      # ==========================================================
      - name: Criar ProGuard
        shell: bash
        run: |
          cat > app/proguard-rules.pro <<'EOF'
          EOF


      # ==========================================================
      # 14 - AndroidManifest
      # ==========================================================
      - name: Criar AndroidManifest
        shell: bash
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="Automensagem"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


      # ==========================================================
      # 15 - Tema
      # ==========================================================
      - name: Criar tema
        shell: bash
        run: |
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>

              </style>

          </resources>
          EOF


      # ==========================================================
      # 16 - Layout
      # ==========================================================
      - name: Criar layout
        shell: bash
        run: |
          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <LinearLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="24dp">

              <TextView
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Automensagem"
                  android:textSize="28sp"
                  android:textStyle="bold" />

              <TextView
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="16dp"
                  android:text="Aplicativo instalado corretamente."
                  android:textSize="18sp" />

          </LinearLayout>
          EOF


      # ==========================================================
      # 17 - MainActivity
      # ==========================================================
      - name: Criar MainActivity
        shell: bash
        run: |
          cat > app/src/main/java/com/automensagem/MainActivity.kt <<'EOF'
          package com.automensagem

          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
              }
          }
          EOF


      # ==========================================================
      # 18 - Configurar Gradle
      # ==========================================================
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      # ==========================================================
      # 19 - Verificar arquivos
      # ==========================================================
      - name: Verificar projeto
        shell: bash
        run: |
          echo "===== ARQUIVOS ====="
          find . -maxdepth 5 -type f | sort

          echo ""
          echo "===== GRADLE ====="
          gradle --version


      # ==========================================================
      # 20 - Compilar APK
      # ==========================================================
      - name: Compilar APK
        shell: bash
        run: |
          gradle assembleDebug \
            --no-daemon \
            --stacktrace


      # ==========================================================
      # 21 - Conferir APK
      # ==========================================================
      - name: Conferir APK
        shell: bash
        run: |
          echo "===== APK GERADO ====="

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          test -f app/build/outputs/apk/debug/app-debug.apk


      # ==========================================================
      # 22 - Publicar APK
      # ==========================================================
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Automensagem-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
