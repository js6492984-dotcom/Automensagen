name: Gerar APK Automensagen

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK Android
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Criar projeto Android
        shell: bash
        run: |
          set -e

          rm -rf app gradle build.gradle settings.gradle gradle.properties
          mkdir -p app/src/main/java/com/automensagen
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Automensagen"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.automensagen'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.automensagen'
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Automensagen</string>
              <string name="accessibility_description">
                  Serviço de acessibilidade do Automensagen
              </string>
          </resources>
          EOF

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
                  <item name="android:statusBarColor">#FFFFFF</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/accessibility_description"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="100"
              android:canRetrieveWindowContent="true"
              android:canPerformGestures="false"
              android:accessibilityFlags="flagDefault"
              />
          EOF

          cat > app/src/main/java/com/automensagen/MainActivity.java <<'EOF'
          package com.automensagen;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.provider.Settings;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.graphics.Color;
          import android.view.Gravity;

          public class MainActivity extends Activity {

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setGravity(Gravity.CENTER);
                  layout.setPadding(48, 48, 48, 48);

                  TextView title = new TextView(this);
                  title.setText("Automensagen");
                  title.setTextSize(28);
                  title.setTextColor(Color.BLACK);
                  title.setGravity(Gravity.CENTER);

                  TextView info = new TextView(this);
                  info.setText(
                      "Aplicativo instalado corretamente.\\n\\n" +
                      "Para utilizar recursos de acessibilidade, " +
                      "abra as configurações abaixo e conceda " +
                      "a permissão somente se você confiar no aplicativo."
                  );
                  info.setTextSize(16);
                  info.setGravity(Gravity.CENTER);
                  info.setPadding(0, 40, 0, 40);

                  Button button = new Button(this);
                  button.setText("Abrir Acessibilidade");
                  button.setOnClickListener(v -> {
                      Intent intent =
                          new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS);
                      startActivity(intent);
                  });

                  layout.addView(title);
                  layout.addView(info);
                  layout.addView(button);

                  setContentView(layout);
              }
          }
          EOF

          cat > app/src/main/java/com/automensagen/AutoReplyService.java <<'EOF'
          package com.automensagen;

          import android.accessibilityservice.AccessibilityService;
          import android.view.accessibility.AccessibilityEvent;

          public class AutoReplyService extends AccessibilityService {

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  // Nenhuma ação automática é executada aqui.
                  // A lógica específica de respostas automáticas
                  // deve ser implementada somente com finalidade legítima.
              }

              @Override
              public void onInterrupt() {
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".AutoReplyService"
                      android:exported="false"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">

                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>

                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />

                  </service>

              </application>

          </manifest>
          EOF

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Gerar Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.10

      - name: Gerar chave de assinatura
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Os secrets KEYSTORE_PASSWORD e KEY_PASSWORD precisam ser configurados."
            exit 1
          fi

          keytool -genkeypair \
            -v \
            -keystore automensagen-release.jks \
            -alias automensagen \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Automensagen, OU=App, O=Automensagen, L=Brasil, ST=BA, C=BR"

      - name: Configurar assinatura Release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")
          s = p.read_text()

          s = s.replace(
              "buildTypes {",
              """signingConfigs {
                  release {
                      storeFile file("../automensagen-release.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias "automensagen"
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }

              buildTypes {"""
          )

          s = s.replace(
              """release {
                      minifyEnabled false
                      shrinkResources false
                  }""",
              """release {
                      minifyEnabled false
                      shrinkResources false
                      signingConfig signingConfigs.release
                  }"""
          )

          p.write_text(s)
          PY

      - name: Compilar APK Release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew clean assembleRelease --stacktrace

      - name: Verificar APK
        run: |
          ls -lh app/build/outputs/apk/release/
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose \
            app/build/outputs/apk/release/app-release.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Automensagen-APK-Release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publicar chave de assinatura
        uses: actions/upload-artifact@v4
        with:
          name: Automensagen-keystore-backup
          path: automensagen-release.jks
          if-no-files-found: error
