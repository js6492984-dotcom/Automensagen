name: Build Automensagen

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-22.04

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4


      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'


      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false


      - name: Criar pastas
        run: |
          mkdir -p app/src/main/java/com/example/automensagen
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values


      - name: Criar settings.gradle
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Automensagen"

          include(":app")
          EOF


      - name: Criar build.gradle
        run: |
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF


      - name: Criar gradle.properties
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF


      - name: Criar app build.gradle
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.automensagen'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.example.automensagen'
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }

          dependencies {
          }
          EOF


      - name: Criar Manifest
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

                  <service
                      android:name=".KachiAccessibilityService"
                      android:exported="false"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">

                      <intent-filter>

                          <action
                              android:name="android.accessibilityservice.AccessibilityService" />

                      </intent-filter>

                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />

                  </service>

              </application>

          </manifest>
          EOF


      - name: Criar configuração de acessibilidade
        run: |
          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged|typeViewClicked"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="100"
              android:canRetrieveWindowContent="true"
              android:description="@string/accessibility_description" />
          EOF


      - name: Criar strings
        run: |
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <string name="app_name">Automensagen</string>

              <string name="accessibility_description">
                  Serviço de automação para envio de mensagens.
              </string>

          </resources>
          EOF


      - name: Criar tema
        run: |
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>

              </style>

          </resources>
          EOF


      - name: Criar MainActivity
        run: |
          cat > app/src/main/java/com/example/automensagen/MainActivity.java <<'EOF'
          package com.example.automensagen;

          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class MainActivity extends Activity {

              @Override
              protected void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);

                  LinearLayout layout =
                          new LinearLayout(this);

                  layout.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  layout.setGravity(
                          Gravity.CENTER
                  );

                  layout.setPadding(
                          40,
                          40,
                          40,
                          40
                  );

                  TextView texto =
                          new TextView(this);

                  texto.setText(
                          "Automensagen\n\n" +
                          "Ative o serviço de acessibilidade."
                  );

                  texto.setTextSize(18);

                  texto.setGravity(
                          Gravity.CENTER
                  );

                  Button botao =
                          new Button(this);

                  botao.setText(
                          "Abrir Acessibilidade"
                  );

                  botao.setOnClickListener(
                          v -> {

                              Intent intent =
                                      new Intent(
                                              Settings.ACTION_ACCESSIBILITY_SETTINGS
                                      );

                              startActivity(intent);
                          }
                  );

                  layout.addView(texto);

                  layout.addView(botao);

                  setContentView(layout);
              }
          }
          EOF


      - name: Criar AccessibilityService
        run: |
          cat > app/src/main/java/com/example/automensagen/KachiAccessibilityService.java <<'EOF'
          package com.example.automensagen;

          import android.accessibilityservice.AccessibilityService;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;

          import java.util.ArrayDeque;
          import java.util.Deque;
          import java.util.Locale;

          public class KachiAccessibilityService
                  extends AccessibilityService {

              private long ultimoClique = 0;

              private static final long INTERVALO =
                      1200;

              @Override
              public void onAccessibilityEvent(
                      AccessibilityEvent event) {

                  AccessibilityNodeInfo raiz =
                          getRootInActiveWindow();

                  if (raiz == null) {
                      return;
                  }

                  procurarEnviar(raiz);
              }

              private void procurarEnviar(
                      AccessibilityNodeInfo raiz) {

                  long agora =
                          System.currentTimeMillis();

                  if (agora - ultimoClique <
                          INTERVALO) {
                      return;
                  }

                  Deque<AccessibilityNodeInfo> fila =
                          new ArrayDeque<>();

                  fila.add(raiz);

                  while (!fila.isEmpty()) {

                      AccessibilityNodeInfo no =
                              fila.removeFirst();

                      if (no == null) {
                          continue;
                      }

                      String texto =
                              obter(no.getText());

                      String descricao =
                              obter(
                                      no.getContentDescription()
                              );

                      String classe =
                              obter(no.getClassName());

                      String valor =
                              (
                                  texto +
                                  " " +
                                  descricao
                              )
                              .toLowerCase(
                                      Locale.ROOT
                              )
                              .trim();

                      boolean enviar =
                              valor.equals("enviar") ||
                              valor.equals("send") ||
                              valor.contains(
                                      "enviar mensagem"
                              ) ||
                              valor.contains(
                                      "send message"
                              );

                      boolean botao =
                              classe.contains(
                                      "Button"
                              ) ||
                              classe.contains(
                                      "ImageButton"
                              ) ||
                              classe.contains(
                                      "FloatingActionButton"
                              );

                      if (enviar && botao) {

                          if (clicar(no)) {

                              ultimoClique =
                                      agora;

                              return;
                          }
                      }

                      if (enviar) {

                          AccessibilityNodeInfo pai =
                                  no.getParent();

                          int nivel = 0;

                          while (
                                  pai != null &&
                                  nivel < 8
                          ) {

                              if (pai.isClickable()) {

                                  if (
                                      pai.performAction(
                                          AccessibilityNodeInfo
                                              .ACTION_CLICK
                                      )
                                  ) {

                                      ultimoClique =
                                              agora;

                                      return;
                                  }
                              }

                              pai =
                                      pai.getParent();

                              nivel++;
                          }
                      }

                      for (
                              int i = 0;
                              i < no.getChildCount();
                              i++
                      ) {

                          AccessibilityNodeInfo filho =
                                  no.getChild(i);

                          if (filho != null) {

                              fila.addLast(filho);
                          }
                      }
                  }
              }

              private boolean clicar(
                      AccessibilityNodeInfo no) {

                  if (no.isClickable()) {

                      if (
                          no.performAction(
                              AccessibilityNodeInfo
                                  .ACTION_CLICK
                          )
                      ) {

                          return true;
                      }
                  }

                  AccessibilityNodeInfo pai =
                          no.getParent();

                  int nivel = 0;

                  while (
                          pai != null &&
                          nivel < 8
                  ) {

                      if (pai.isClickable()) {

                          if (
                              pai.performAction(
                                  AccessibilityNodeInfo
                                      .ACTION_CLICK
                              )
                          ) {

                              return true;
                          }
                      }

                      pai =
                              pai.getParent();

                      nivel++;
                  }

                  return false;
              }

              private String obter(
                      CharSequence valor) {

                  if (valor == null) {
                      return "";
                  }

                  return valor.toString();
              }

              @Override
              public void onInterrupt() {
              }
          }
          EOF


      - name: Compilar
        run: |
          gradle --no-daemon assembleDebug --stacktrace


      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Automensagen-debug
          path: app/build/outputs/apk/debug/app-debug.apk
