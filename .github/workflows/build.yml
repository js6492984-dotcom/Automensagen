name: Build Automensagen

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1 - BAIXAR O REPOSITÓRIO
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # 2 - JAVA
      # ============================================================

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 3 - GRADLE
      # ============================================================

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"


      # ============================================================
      # 4 - ANDROID SDK
      # ============================================================

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"


      # ============================================================
      # 5 - CRIAR ESTRUTURA DO PROJETO
      # ============================================================

      - name: Criar projeto Android
        shell: bash
        run: |

          mkdir -p app/src/main/java/com/example/automensagen
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values


      # ============================================================
      # 6 - settings.gradle
      # ============================================================

      - name: Criar settings.gradle
        shell: bash
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Automensagen"

          include(":app")
          EOF


      # ============================================================
      # 7 - build.gradle
      # ============================================================

      - name: Criar build.gradle
        shell: bash
        run: |
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF


      # ============================================================
      # 8 - gradle.properties
      # ============================================================

      - name: Criar gradle.properties
        shell: bash
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF


      # ============================================================
      # 9 - app/build.gradle
      # ============================================================

      - name: Criar app/build.gradle
        shell: bash
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.automensagen'

              compileSdk 35

              defaultConfig {
                  applicationId 'com.example.automensagen'

                  minSdk 26

                  targetSdk 35

                  versionCode 1

                  versionName '1.0'
              }
          }

          dependencies {
          }
          EOF


      # ============================================================
      # 10 - AndroidManifest.xml
      # ============================================================

      - name: Criar AndroidManifest.xml
        shell: bash
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>


                  <service
                      android:name=".KachiAccessibilityService"
                      android:exported="false"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">

                      <intent-filter>

                          <action
                              android:name="android.accessibilityservice.AccessibilityService" />

                      </intent-filter>

                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />

                  </service>

              </application>

          </manifest>
          EOF


      # ============================================================
      # 11 - accessibility_service_config.xml
      # ============================================================

      - name: Criar configuração de acessibilidade
        shell: bash
        run: |
          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"

              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged|typeViewClicked"

              android:accessibilityFeedbackType="feedbackGeneric"

              android:notificationTimeout="100"

              android:canRetrieveWindowContent="true"

              android:description="@string/accessibility_description" />

          EOF


      # ============================================================
      # 12 - strings.xml
      # ============================================================

      - name: Criar strings.xml
        shell: bash
        run: |
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <string name="app_name">Automensagen</string>

              <string name="accessibility_description">
                  Automação para localizar e clicar no botão de envio.
              </string>

          </resources>
          EOF


      # ============================================================
      # 13 - styles.xml
      # ============================================================

      - name: Criar styles.xml
        shell: bash
        run: |
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>

                  <item name="android:colorAccent">#2196F3</item>

              </style>

          </resources>
          EOF


      # ============================================================
      # 14 - MainActivity.java
      # ============================================================

      - name: Criar MainActivity.java
        shell: bash
        run: |
          cat > app/src/main/java/com/example/automensagen/MainActivity.java <<'EOF'
          package com.example.automensagen;

          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class MainActivity extends Activity {

              @Override
              protected void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);

                  LinearLayout layout = new LinearLayout(this);

                  layout.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  layout.setGravity(
                          Gravity.CENTER
                  );

                  layout.setPadding(
                          40,
                          40,
                          40,
                          40
                  );


                  TextView titulo = new TextView(this);

                  titulo.setText(
                          "Automensagen\n\n" +
                          "Ative o serviço de acessibilidade " +
                          "para permitir a automação."
                  );

                  titulo.setTextSize(18);

                  titulo.setGravity(
                          Gravity.CENTER
                  );


                  Button botao = new Button(this);

                  botao.setText(
                          "Abrir Acessibilidade"
                  );


                  botao.setOnClickListener(
                          view -> {

                              Intent intent =
                                      new Intent(
                                              Settings.ACTION_ACCESSIBILITY_SETTINGS
                                      );

                              startActivity(intent);

                          }
                  );


                  layout.addView(titulo);

                  layout.addView(botao);

                  setContentView(layout);
              }
          }
          EOF


      # ============================================================
      # 15 - KachiAccessibilityService.java
      # ============================================================

      - name: Criar serviço de acessibilidade
        shell: bash
        run: |
          cat > app/src/main/java/com/example/automensagen/KachiAccessibilityService.java <<'EOF'
          package com.example.automensagen;

          import android.accessibilityservice.AccessibilityService;

          import android.view.accessibility.AccessibilityEvent;

          import android.view.accessibility.AccessibilityNodeInfo;

          import java.util.ArrayDeque;

          import java.util.Deque;

          import java.util.Locale;


          public class KachiAccessibilityService
                  extends AccessibilityService {


              private long ultimoClique = 0;

              private static final long INTERVALO_CLIQUE = 1200;


              @Override
              public void onAccessibilityEvent(
                      AccessibilityEvent event) {


                  AccessibilityNodeInfo raiz =
                          getRootInActiveWindow();


                  if (raiz == null) {
                      return;
                  }


                  procurarBotaoEnviar(raiz);
              }


              private void procurarBotaoEnviar(
                      AccessibilityNodeInfo raiz) {


                  long agora =
                          System.currentTimeMillis();


                  if (agora - ultimoClique
                          < INTERVALO_CLIQUE) {

                      return;
                  }


                  Deque<AccessibilityNodeInfo> fila =
                          new ArrayDeque<>();


                  fila.add(raiz);


                  while (!fila.isEmpty()) {


                      AccessibilityNodeInfo no =
                              fila.removeFirst();


                      if (no == null) {
                          continue;
                      }


                      String texto =
                              obterTexto(
                                      no.getText()
                              );


                      String descricao =
                              obterTexto(
                                      no.getContentDescription()
                              );


                      String classe =
                              obterTexto(
                                      no.getClassName()
                              );


                      String identificacao =
                              (
                                  texto +
                                  " " +
                                  descricao
                              )
                              .toLowerCase(
                                      Locale.ROOT
                              )
                              .trim();


                      boolean ehEnviar =

                              identificacao.equals(
                                      "enviar"
                              )

                              ||

                              identificacao.equals(
                                      "send"
                              )

                              ||

                              identificacao.contains(
                                      "enviar mensagem"
                              )

                              ||

                              identificacao.contains(
                                      "send message"
                              );


                      boolean ehBotao =

                              classe.contains(
                                      "Button"
                              )

                              ||

                              classe.contains(
                                      "ImageButton"
                              )

                              ||

                              classe.contains(
                                      "FloatingActionButton"
                              );


                      /*
                       * PRIMEIRA TENTATIVA:
                       *
                       * procura diretamente por
                       * um botão chamado Enviar.
                       */


                      if (ehEnviar && ehBotao) {


                          if (clicar(no)) {


                              ultimoClique =
                                      agora;


                              return;
                          }
                      }


                      /*
                       * SEGUNDA TENTATIVA:
                       *
                       * o texto "Enviar" pode estar
                       * dentro de outro elemento.
                       *
                       * Nesse caso procuramos
                       * um pai clicável.
                       */


                      if (ehEnviar) {


                          AccessibilityNodeInfo pai =
                                  no.getParent();


                          int nivel = 0;


                          while (
                                  pai != null &&
                                  nivel < 8
                          ) {


                              if (pai.isClickable()) {


                                  boolean sucesso =
                                          pai.performAction(
                                              AccessibilityNodeInfo
                                                  .ACTION_CLICK
                                          );


                                  if (sucesso) {


                                      ultimoClique =
                                              agora;


                                      return;
                                  }
                              }


                              pai =
                                      pai.getParent();


                              nivel++;
                          }
                      }


                      /*
                       * TERCEIRA TENTATIVA:
                       *
                       * continua percorrendo
                       * todos os elementos da tela.
                       */


                      for (
                              int i = 0;
                              i < no.getChildCount();
                              i++
                      ) {


                          AccessibilityNodeInfo filho =
                                  no.getChild(i);


                          if (filho != null) {


                              fila.addLast(
                                      filho
                              );
                          }
                      }
                  }
              }


              private boolean clicar(
                      AccessibilityNodeInfo no
              ) {


                  /*
                   * Tenta clicar no próprio
                   * elemento.
                   */


                  if (no.isClickable()) {


                      boolean sucesso =
                              no.performAction(
                                  AccessibilityNodeInfo
                                      .ACTION_CLICK
                              );


                      if (sucesso) {
                          return true;
                      }
                  }


                  /*
                   * Se não conseguir,
                   * procura um pai clicável.
                   */


                  AccessibilityNodeInfo pai =
                          no.getParent();


                  int nivel = 0;


                  while (
                          pai != null &&
                          nivel < 8
                  ) {


                      if (pai.isClickable()) {


                          boolean sucesso =
                                  pai.performAction(
                                      AccessibilityNodeInfo
                                          .ACTION_CLICK
                                  );


                          if (sucesso) {
                              return true;
                          }
                      }


                      pai =
                              pai.getParent();


                      nivel++;
                  }


                  return false;
              }


              private String obterTexto(
                      CharSequence valor
              ) {


                  if (valor == null) {
                      return "";
                  }


                  return valor.toString();
              }


              @Override
              public void onInterrupt() {
              }
          }
          EOF


      # ============================================================
      # 16 - MOSTRAR ESTRUTURA
      # ============================================================

      - name: Conferir arquivos
        run: |
          echo "===== PROJETO ====="
          find . -maxdepth 8 -type f | sort


      # ============================================================
      # 17 - COMPILAR
      # ============================================================

      - name: Compilar APK
        run: |
          gradle assembleDebug --stacktrace


      # ============================================================
      # 18 - DISPONIBILIZAR APK
      # ============================================================

      - name: Enviar APK
        uses: actions/upload-artifact@v4

        with:
          name: Automensagen-debug

          path: app/build/outputs/apk/debug/app-debug.apk
