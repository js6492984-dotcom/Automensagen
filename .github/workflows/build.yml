name: Gerar APK Automensagem

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager não encontrado"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Criar projeto Android
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/automensagen
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Automensagem"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.automensagen'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.automensagen'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Automensagem</string>
              <string name="accessibility_description">
                  Serviço de respostas automáticas do Automensagem
              </string>
          </resources>
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <LinearLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="24dp">

              <TextView
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Automensagem"
                  android:textSize="28sp"
                  android:textStyle="bold"
                  android:paddingBottom="20dp" />

              <TextView
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Ative o serviço de acessibilidade para permitir que o Automensagem leia as mensagens e envie respostas no Kachi."
                  android:textSize="17sp"
                  android:paddingBottom="25dp" />

              <Button
                  android:id="@+id/btnAcessibilidade"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="ATIVAR ACESSIBILIDADE" />

          </LinearLayout>
          EOF

          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/accessibility_description"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged|typeViewTextChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="100"
              android:canRetrieveWindowContent="true"
              android:canPerformGestures="true"
              android:accessibilityFlags="flagDefault|flagReportViewIds" />
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".AutoReplyAccessibilityService"
                      android:exported="false"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">

                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>

                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />

                  </service>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/automensagen/MainActivity.java <<'EOF'
          package com.automensagen;

          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.widget.Button;

          public class MainActivity extends Activity {

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  setContentView(R.layout.activity_main);

                  Button botao = findViewById(R.id.btnAcessibilidade);

                  botao.setOnClickListener(v -> {
                      Intent intent =
                              new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS);

                      startActivity(intent);
                  });
              }
          }
          EOF

          cat > app/src/main/java/com/automensagen/AutoReplyAccessibilityService.java <<'EOF'
          package com.automensagen;

          import android.accessibilityservice.AccessibilityService;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;

          import java.util.List;
          import java.util.Locale;

          public class AutoReplyAccessibilityService
                  extends AccessibilityService {

              private final Handler handler =
                      new Handler(Looper.getMainLooper());

              private boolean respondendo = false;

              private long ultimaResposta = 0;

              private static final long INTERVALO = 3000;

              @Override
              public void onAccessibilityEvent(
                      AccessibilityEvent event) {

                  if (event == null) {
                      return;
                  }

                  CharSequence pacote = event.getPackageName();

                  if (pacote == null) {
                      return;
                  }

                  String nomePacote =
                          pacote.toString().toLowerCase(Locale.ROOT);

                  /*
                   * Só executa dentro do Kachi.
                   */
                  if (!nomePacote.contains("kachi")) {
                      return;
                  }

                  if (respondendo) {
                      return;
                  }

                  long agora = System.currentTimeMillis();

                  if (agora - ultimaResposta < INTERVALO) {
                      return;
                  }

                  AccessibilityNodeInfo raiz =
                          getRootInActiveWindow();

                  if (raiz == null) {
                      return;
                  }

                  procurarOi(raiz);
              }

              private void procurarOi(
                      AccessibilityNodeInfo no) {

                  if (no == null) {
                      return;
                  }

                  CharSequence texto = no.getText();

                  if (texto != null) {

                      String valor =
                              texto.toString()
                              .trim()
                              .toLowerCase(Locale.ROOT);

                      if (valor.equals("oi")) {
                          responder();
                          return;
                      }
                  }

                  CharSequence descricao =
                          no.getContentDescription();

                  if (descricao != null) {

                      String valor =
                              descricao.toString()
                              .trim()
                              .toLowerCase(Locale.ROOT);

                      if (valor.equals("oi")) {
                          responder();
                          return;
                      }
                  }

                  for (int i = 0;
                       i < no.getChildCount();
                       i++) {

                      AccessibilityNodeInfo filho =
                              no.getChild(i);

                      procurarOi(filho);
                  }
              }

              private void responder() {

                  if (respondendo) {
                      return;
                  }

                  respondendo = true;

                  AccessibilityNodeInfo raiz =
                          getRootInActiveWindow();

                  if (raiz == null) {
                      respondendo = false;
                      return;
                  }

                  AccessibilityNodeInfo campo =
                          encontrarCampoEditavel(raiz);

                  if (campo == null) {
                      respondendo = false;
                      return;
                  }

                  campo.performAction(
                          AccessibilityNodeInfo.ACTION_FOCUS);

                  Bundle argumentos = new Bundle();

                  argumentos.putCharSequence(
                          AccessibilityNodeInfo
                          .ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE,
                          "Olá! Como posso ajudar?");

                  campo.performAction(
                          AccessibilityNodeInfo.ACTION_SET_TEXT,
                          argumentos);

                  handler.postDelayed(() -> {

                      AccessibilityNodeInfo novaRaiz =
                              getRootInActiveWindow();

                      if (novaRaiz != null) {
                          clicarBotaoEnviar(novaRaiz);
                      }

                      ultimaResposta =
                              System.currentTimeMillis();

                      respondendo = false;

                  }, 500);
              }

              private AccessibilityNodeInfo
              encontrarCampoEditavel(
                      AccessibilityNodeInfo no) {

                  if (no == null) {
                      return null;
                  }

                  if (no.isEditable()) {
                      return no;
                  }

                  for (int i = 0;
                       i < no.getChildCount();
                       i++) {

                      AccessibilityNodeInfo resultado =
                              encontrarCampoEditavel(
                                      no.getChild(i));

                      if (resultado != null) {
                          return resultado;
                      }
                  }

                  return null;
              }

              private void clicarBotaoEnviar(
                      AccessibilityNodeInfo raiz) {

                  /*
                   * Procura primeiro pelo texto Enviar.
                   */
                  AccessibilityNodeInfo botao =
                          encontrarPorTexto(
                                  raiz,
                                  "enviar");

                  if (botao != null) {

                      if (botao.isClickable()) {

                          botao.performAction(
                                  AccessibilityNodeInfo
                                  .ACTION_CLICK);

                          return;
                      }

                      AccessibilityNodeInfo pai =
                              encontrarPaiClicavel(botao);

                      if (pai != null) {

                          pai.performAction(
                                  AccessibilityNodeInfo
                                  .ACTION_CLICK);

                          return;
                      }
                  }

                  /*
                   * Procura pela descrição do botão.
                   */
                  botao =
                          encontrarPorDescricao(
                                  raiz,
                                  "enviar");

                  if (botao != null) {

                      if (botao.isClickable()) {

                          botao.performAction(
                                  AccessibilityNodeInfo
                                  .ACTION_CLICK);

                          return;
                      }

                      AccessibilityNodeInfo pai =
                              encontrarPaiClicavel(botao);

                      if (pai != null) {

                          pai.performAction(
                                  AccessibilityNodeInfo
                                  .ACTION_CLICK);
                      }
                  }
              }

              private AccessibilityNodeInfo
              encontrarPorTexto(
                      AccessibilityNodeInfo no,
                      String procurado) {

                  if (no == null) {
                      return null;
                  }

                  CharSequence texto = no.getText();

                  if (texto != null &&
                      texto.toString()
                          .toLowerCase(Locale.ROOT)
                          .contains(procurado)) {

                      return no;
                  }

                  for (int i = 0;
                       i < no.getChildCount();
                       i++) {

                      AccessibilityNodeInfo resultado =
                              encontrarPorTexto(
                                      no.getChild(i),
                                      procurado);

                      if (resultado != null) {
                          return resultado;
                      }
                  }

                  return null;
              }

              private AccessibilityNodeInfo
              encontrarPorDescricao(
                      AccessibilityNodeInfo no,
                      String procurado) {

                  if (no == null) {
                      return null;
                  }

                  CharSequence descricao =
                          no.getContentDescription();

                  if (descricao != null &&
                      descricao.toString()
                          .toLowerCase(Locale.ROOT)
                          .contains(procurado)) {

                      return no;
                  }

                  for (int i = 0;
                       i < no.getChildCount();
                       i++) {

                      AccessibilityNodeInfo resultado =
                              encontrarPorDescricao(
                                      no.getChild(i),
                                      procurado);

                      if (resultado != null) {
                          return resultado;
                      }
                  }

                  return null;
              }

              private AccessibilityNodeInfo
              encontrarPaiClicavel(
                      AccessibilityNodeInfo no) {

                  AccessibilityNodeInfo atual = no;

                  for (int i = 0;
                       i < 8 && atual != null;
                       i++) {

                      if (atual.isClickable()) {
                          return atual;
                      }

                      atual = atual.getParent();
                  }

                  return null;
              }

              @Override
              public void onInterrupt() {

                  respondendo = false;
              }
          }
          EOF

      - name: Instalar Gradle 8.9
        shell: bash
        run: |
          set -e

          curl -fL \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -o "$RUNNER_TEMP/gradle.zip"

          unzip -q \
            "$RUNNER_TEMP/gradle.zip" \
            -d "$RUNNER_TEMP"

          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Compilar APK
        shell: bash
        run: |
          set -e

          gradle --version

          gradle \
            --no-daemon \
            --stacktrace \
            --console=plain \
            assembleDebug

      - name: Verificar APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERRO: APK não foi criado."
            exit 1
          fi

          ls -lh "$APK"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Automensagem-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
