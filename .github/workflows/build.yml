name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Criar estrutura do Android
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/automensagen
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Automensagen"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.automensagen'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.automensagen'
                  minSdk 24
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Automensagen</string>
              <string name="accessibility_description">Serviço de automação do Automensagen.</string>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#6750A4</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
                  <item name="android:statusBarColor">#FFFFFF</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowContentChanged|typeWindowStateChanged|typeViewTextChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="100"
              android:canRetrieveWindowContent="true"
              android:canPerformGestures="true"
              android:description="@string/accessibility_description" />
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".AutoReplyAccessibilityService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="false">

                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>

                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />

                  </service>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/automensagen/MainActivity.java <<'EOF'
          package com.automensagen;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.Switch;
          import android.widget.TextView;
          import android.widget.Toast;

          import org.json.JSONArray;
          import org.json.JSONObject;

          public class MainActivity extends Activity {

              private SharedPreferences prefs;
              private LinearLayout regras;
              private TextView status;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  prefs = getSharedPreferences("automensagen", Context.MODE_PRIVATE);

                  criarTela();
              }

              private TextView texto(String valor, float tamanho) {
                  TextView t = new TextView(this);
                  t.setText(valor);
                  t.setTextSize(tamanho);
                  t.setTextColor(Color.BLACK);
                  t.setPadding(0, 12, 0, 12);
                  return t;
              }

              private void criarTela() {

                  ScrollView scroll = new ScrollView(this);

                  LinearLayout principal = new LinearLayout(this);
                  principal.setOrientation(LinearLayout.VERTICAL);
                  principal.setPadding(40, 40, 40, 40);

                  TextView titulo = texto("Automensagen", 30);
                  titulo.setGravity(Gravity.CENTER);
                  principal.addView(titulo);

                  TextView descricao = texto(
                          "Configure respostas automáticas por palavra-chave.",
                          17
                  );
                  principal.addView(descricao);

                  status = texto("", 17);
                  principal.addView(status);

                  Switch ativar = new Switch(this);
                  ativar.setText("Ativar automação");
                  ativar.setTextSize(18);
                  ativar.setChecked(
                          prefs.getBoolean("ativo", false)
                  );

                  ativar.setOnCheckedChangeListener(
                          (buttonView, checked) -> {
                              prefs.edit()
                                      .putBoolean("ativo", checked)
                                      .apply();

                              atualizarStatus();
                          }
                  );

                  principal.addView(ativar);

                  Button acessibilidade = new Button(this);
                  acessibilidade.setText("Abrir Acessibilidade");

                  acessibilidade.setOnClickListener(v -> {
                      Intent intent = new Intent(
                              Settings.ACTION_ACCESSIBILITY_SETTINGS
                      );
                      startActivity(intent);
                  });

                  principal.addView(acessibilidade);

                  principal.addView(
                          texto("Nova regra", 23)
                  );

                  EditText palavra = new EditText(this);
                  palavra.setHint("Palavra-chave");
                  principal.addView(palavra);

                  EditText resposta = new EditText(this);
                  resposta.setHint("Resposta automática");
                  resposta.setMinLines(3);
                  resposta.setGravity(Gravity.TOP);
                  principal.addView(resposta);

                  Button adicionar = new Button(this);
                  adicionar.setText("Adicionar regra");

                  adicionar.setOnClickListener(v -> {

                      String p = palavra.getText()
                              .toString()
                              .trim();

                      String r = resposta.getText()
                              .toString()
                              .trim();

                      if (p.isEmpty() || r.isEmpty()) {

                          Toast.makeText(
                                  this,
                                  "Preencha os dois campos.",
                                  Toast.LENGTH_SHORT
                          ).show();

                          return;
                      }

                      adicionarRegra(p, r);

                      palavra.setText("");
                      resposta.setText("");

                      mostrarRegras();

                      Toast.makeText(
                              this,
                              "Regra adicionada!",
                              Toast.LENGTH_SHORT
                      ).show();
                  });

                  principal.addView(adicionar);

                  principal.addView(
                          texto("Regras cadastradas", 23)
                  );

                  regras = new LinearLayout(this);
                  regras.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  principal.addView(regras);

                  scroll.addView(principal);

                  setContentView(scroll);

                  atualizarStatus();
                  mostrarRegras();
              }

              private void atualizarStatus() {

                  boolean ativo =
                          prefs.getBoolean("ativo", false);

                  if (ativo) {
                      status.setText(
                              "Status: AUTOMATIZAÇÃO ATIVADA"
                      );
                  } else {
                      status.setText(
                              "Status: automação desativada"
                      );
                  }
              }

              private JSONArray obterRegras() {

                  String dados =
                          prefs.getString("regras", "[]");

                  try {
                      return new JSONArray(dados);
                  } catch (Exception e) {
                      return new JSONArray();
                  }
              }

              private void adicionarRegra(
                      String palavra,
                      String resposta
              ) {

                  JSONArray array = obterRegras();

                  try {

                      JSONObject regra =
                              new JSONObject();

                      regra.put("palavra", palavra);
                      regra.put("resposta", resposta);

                      array.put(regra);

                      prefs.edit()
                              .putString(
                                      "regras",
                                      array.toString()
                              )
                              .apply();

                  } catch (Exception ignored) {
                  }
              }

              private void excluirRegra(int posicao) {

                  JSONArray antigo
