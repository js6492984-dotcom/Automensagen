name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Baixar o código do repositório
      # ============================================================
      - name: Baixar código
        uses: actions/checkout@v4


      # ============================================================
      # 2. Configurar Java 17
      # IMPORTANTE:
      # Não usar cache: gradle aqui porque o projeto ainda será criado.
      # ============================================================
      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. Configurar Android SDK
      # ============================================================
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3


      # ============================================================
      # 4. Instalar componentes necessários do Android
      # ============================================================
      - name: Instalar Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # ============================================================
      # 5. Criar estrutura do projeto Android
      # ============================================================
      - name: Criar estrutura do projeto Android
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/automensagem
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml


      # ============================================================
      # 6. Criar settings.gradle
      # ============================================================
      - name: Criar settings.gradle
        shell: bash
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Automensagem"
          include(":app")
          EOF


      # ============================================================
      # 7. Criar build.gradle principal
      # ============================================================
      - name: Criar build.gradle principal
        shell: bash
        run: |
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF


      # ============================================================
      # 8. Criar gradle.properties
      # ============================================================
      - name: Criar gradle.properties
        shell: bash
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF


      # ============================================================
      # 9. Criar build.gradle do aplicativo
      # ============================================================
      - name: Criar build.gradle do aplicativo
        shell: bash
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.automensagem'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.automensagem'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.15.0'
              implementation 'androidx.appcompat:appcompat:1.7.0'
          }
          EOF


      # ============================================================
      # 10. Criar proguard
      # ============================================================
      - name: Criar proguard-rules.pro
        shell: bash
        run: |
          cat > app/proguard-rules.pro <<'EOF'
          # Regras do ProGuard
          EOF


      # ============================================================
      # 11. Criar AndroidManifest
      # ============================================================
      - name: Criar AndroidManifest.xml
        shell: bash
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="Automensagem"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


      # ============================================================
      # 12. Criar tema
      # ============================================================
      - name: Criar tema
        shell: bash
        run: |
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>

              </style>

          </resources>
          EOF


      # ============================================================
      # 13. Criar layout
      # ============================================================
      - name: Criar layout
        shell: bash
        run: |
          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <LinearLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="24dp">

              <TextView
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Automensagem"
                  android:textSize="28sp"
                  android:textStyle="bold" />

              <TextView
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="16dp"
                  android:text="Aplicativo instalado corretamente."
                  android:textSize="18sp" />

          </LinearLayout>
          EOF


      # ============================================================
      # 14. Criar MainActivity
      # ============================================================
      - name: Criar MainActivity
        shell: bash
        run: |
          cat > app/src/main/java/com/automensagem/MainActivity.kt <<'EOF'
          package com.automensagem

          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
              }
          }
          EOF


      # ============================================================
      # 15. Instalar Gradle
      # ============================================================
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      # ============================================================
      # 16. Verificar estrutura
      # ============================================================
      - name: Verificar projeto
        shell: bash
        run: |
          echo "===== ESTRUTURA ====="
          find . -maxdepth 4 -type f | sort

          echo ""
          echo "===== GRADLE ====="
          gradle --version


      # ============================================================
      # 17. Compilar APK
      # ============================================================
      - name: Compilar APK
        shell: bash
        run: |
          gradle assembleDebug --no-daemon --stacktrace


      # ============================================================
      # 18. Verificar APK
      # ============================================================
      - name: Verificar APK gerado
        shell: bash
        run: |
          echo "===== APKs ====="
          find app/build/outputs/apk -type f -name "*.apk" -print

          test -f app/build/outputs/apk/debug/app-debug.apk


      # ============================================================
      # 19. Publicar APK nos Artifacts
      # ============================================================
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Automensagem-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
