name: Gerar APK Automensagen

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v6

      - name: Instalar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Criar projeto Android
        shell: bash
        run: |
          set -e

          rm -rf app
          rm -f build.gradle settings.gradle gradle.properties
          rm -rf APK

          mkdir -p app/src/main/java/com/automensagen
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          mkdir -p APK

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Automensagen"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.automensagen'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.automensagen'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      shrinkResources false
                  }

                  debug {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Automensagen</string>
          </resources>
          EOF

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#2196F3</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowContentChanged|typeWindowStateChanged|typeViewTextChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="300"
              android:canRetrieveWindowContent="true"
              android:accessibilityFlags="flagReportViewIds|flagRetrieveInteractiveWindows"
              android:description="@string/app_name" />
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".AutoReplyService"
                      android:exported="false"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">

                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>

                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />

                  </service>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/automensagen/MainActivity.java <<'EOF'
          package com.automensagen;

          import android.app.Activity;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.text.InputType;
          import android.view.View;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.Switch;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {

              private SharedPreferences prefs;
              private LinearLayout rulesContainer;

              private int dp(int value) {
                  return (int) (value *
                      getResources().getDisplayMetrics().density + 0.5f);
              }

              private TextView label(String text, int size) {
                  TextView view = new TextView(this);
                  view.setText(text);
                  view.setTextSize(size);
                  view.setTextColor(Color.BLACK);
                  view.setPadding(0, dp(6), 0, dp(6));
                  return view;
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  prefs = getSharedPreferences(
                      "automensagen",
                      MODE_PRIVATE
                  );

                  ScrollView scroll = new ScrollView(this);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(
                      dp(20),
                      dp(20),
                      dp(20),
                      dp(30)
                  );

                  TextView title = label(
                      "Automensagen",
                      28
                  );
                  title.setTypeface(
                      Typeface.DEFAULT,
                      Typeface.BOLD
                  );
                  root.addView(title);

                  root.addView(label(
                      "Respostas automáticas por palavras-chave",
                      16
                  ));

                  Switch active = new Switch(this);
                  active.setText(
                      "Ativar respostas automáticas"
                  );
                  active.setTextSize(17);
                  active.setChecked(
                      prefs.getBoolean("enabled", false)
                  );

                  active.setOnCheckedChangeListener(
                      (button, checked) ->
                          prefs.edit()
                              .putBoolean("enabled", checked)
                              .apply()
                  );

                  root.addView(active);

                  Button accessibility = new Button(this);
                  accessibility.setText(
                      "Abrir configurações de acessibilidade"
                  );

                  accessibility.setOnClickListener(v -> {
                      try {
                          startActivity(
                              new Intent(
                                  Settings.ACTION_ACCESSIBILITY_SETTINGS
                              )
                          );
                      } catch (Exception e) {
                          Toast.makeText(
                              this,
                              "Não foi possível abrir as configurações.",
                              Toast.LENGTH_LONG
                          ).show();
                      }
                  });

                  root.addView(accessibility);

                  root.addView(label(
                      "Intervalo entre respostas (segundos)",
                      16
                  ));

                  EditText delay = new EditText(this);
                  delay.setInputType(
                      InputType.TYPE_CLASS_NUMBER
                  );
                  delay.setText(
                      String.valueOf(
                          prefs.getInt("delay", 5)
                      )
                  );
                  root.addView(delay);

                  Button saveDelay = new Button(this);
                  saveDelay.setText("Salvar intervalo");

                  saveDelay.setOnClickListener(v -> {
                      try {
                          int value = Integer.parseInt(
                              delay.getText().toString()
                          );

                          if (value < 0) {
                              value = 0;
                          }

                          prefs.edit()
                              .putInt("delay", value)
                              .apply();

                          Toast.makeText(
                              this,
                              "Intervalo salvo.",
                              Toast.LENGTH_SHORT
                          ).show();

                      } catch (Exception e) {
                          Toast.makeText(
                              this,
                              "Digite um número válido.",
                              Toast.LENGTH_SHORT
                          ).show();
                      }
                  });

                  root.addView(saveDelay);

                  TextView ruleTitle = label(
                      "Regras de resposta",
                      20
                  );

                  ruleTitle.setTypeface(
                      Typeface.DEFAULT,
                      Typeface.BOLD
                  );

                  root.addView(ruleTitle);

                  rulesContainer = new LinearLayout(this);
                  rulesContainer.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  root.addView(rulesContainer);

                  loadRules();

                  Button addRule = new Button(this);
                  addRule.setText("Adicionar regra");

                  addRule.setOnClickListener(
                      v -> addRule()
                  );

                  root.addView(addRule);

                  root.addView(label(
                      "\nComo usar:\n" +
                      "1. Adicione uma palavra ou frase.\n" +
                      "2. Digite a resposta automática.\n" +
                      "3. Ative as respostas automáticas.\n" +
                      "4. Ative o serviço Automensagen nas configurações de acessibilidade.",
                      15
                  ));

                  scroll.addView(root);
                  setContentView(scroll);
              }

              private void addRule() {
                  int count = prefs.getInt("rule_count", 0);

                  prefs.edit()
                      .putString("keyword_" + count, "")
                      .putString("response_" + count, "")
                      .putBoolean(
                          "rule_enabled_" + count,
                          true
                      )
                      .putInt(
                          "rule_count",
                          count + 1
                      )
                      .apply();

                  loadRules();
              }

              private void loadRules() {
                  if (rulesContainer == null) {
                      return;
                  }

                  rulesContainer.removeAllViews();

                  int count = prefs.getInt(
                      "rule_count",
                      0
                  );

                  for (int i = 0; i < count; i++) {
                      addRuleView(i);
                  }
              }

              private void addRuleView(int index) {
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(
                      LinearLayout.VERTICAL
                  );
                  box.setPadding(
                      dp(8),
                      dp(8),
                      dp(8),
                      dp(16)
                  );

                  TextView number = label(
                      "Regra " + (index + 1),
                      17
                  );

                  number.setTypeface(
                      Typeface.DEFAULT,
                      Typeface.BOLD
                  );

                  box.addView(number);

                  EditText keyword = new EditText(this);
                  keyword.setHint("Palavra-chave");
                  keyword.setSingleLine(true);
                  keyword.setText(
                      prefs.getString(
                          "keyword_" + index,
                          ""
                      )
                  );
                  box.addView(keyword);

                  EditText response = new EditText(this);
                  response.setHint("Resposta automática");
                  response.setMinLines(2);
                  response.setText(
                      prefs.getString(
                          "response_" + index,
                          ""
                      )
                  );
                  box.addView(response);

                  Switch enabled = new Switch(this);
                  enabled.setText("Regra ativada");
                  enabled.setChecked(
                      prefs.getBoolean(
                          "rule_enabled_" + index,
                          true
                      )
                  );
                  box.addView(enabled);

                  Button save = new Button(this);
                  save.setText("Salvar regra");

                  save.setOnClickListener(v -> {
                      prefs.edit()
                          .putString(
                              "keyword_" + index,
                              keyword.getText().toString()
                          )
                          .putString(
                              "response_" + index,
                              response.getText().toString()
                          )
                          .putBoolean(
                              "rule_enabled_" + index,
                              enabled.isChecked()
                          )
                          .apply();

                      Toast.makeText(
                          this,
                          "Regra salva.",
                          Toast.LENGTH_SHORT
                      ).show();
                  });

                  box.addView(save);

                  Button delete = new Button(this);
                  delete.setText("Excluir regra");

                  delete.setOnClickListener(
                      v -> deleteRule(index)
                  );

                  box.addView(delete);

                  rulesContainer.addView(box);
              }

              private void deleteRule(int index) {
                  int count = prefs.getInt(
                      "rule_count",
                      0
                  );

                  for (int i = index; i < count - 1; i++) {
                      prefs.edit()
                          .putString(
                              "keyword_" + i,
                              prefs.getString(
                                  "keyword_" + (i + 1),
                                  ""
                              )
                          )
                          .putString(
                              "response_" + i,
                              prefs.getString(
                                  "response_" + (i + 1),
                                  ""
                              )
                          )
                          .putBoolean(
                              "rule_enabled_" + i,
                              prefs.getBoolean(
                                  "rule_enabled_" + (i + 1),
                                  true
                              )
                          )
                          .apply();
                  }

                  prefs.edit()
                      .remove("keyword_" + (count - 1))
                      .remove("response_" + (count - 1))
                      .remove("rule_enabled_" + (count - 1))
                      .putInt(
                          "rule_count",
                          Math.max(0, count - 1)
                      )
                      .apply();

                  loadRules();
              }
          }
          EOF

          cat > app/src/main/java/com/automensagen/AutoReplyService.java <<'EOF'
          package com.automensagen;

          import android.accessibilityservice.AccessibilityService;
          import android.os.Bundle;
          import android.os.Handler;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;

          import java.util.ArrayList;
          import java.util.List;
          import java.util.Locale;

          public class AutoReplyService
              extends AccessibilityService {

              private android.content.SharedPreferences prefs;

              private final Handler handler =
                  new Handler();

              private long lastReplyTime = 0;

              private String lastScreenText = "";

              @Override
              protected void onServiceConnected() {
                  super.onServiceConnected();

                  prefs = getSharedPreferences(
                      "automensagen",
                      MODE_PRIVATE
                  );
              }

              @Override
              public void onAccessibilityEvent(
                  AccessibilityEvent event
              ) {

                  if (prefs == null) {
                      prefs = getSharedPreferences(
                          "automensagen",
                          MODE_PRIVATE
                      );
                  }

                  if (!prefs.getBoolean(
                      "enabled",
                      false
                  )) {
                      return;
                  }

                  if (event == null) {
                      return;
                  }

                  int type = event.getEventType();

                  if (type !=
                          AccessibilityEvent
                              .TYPE_WINDOW_CONTENT_CHANGED &&
                      type !=
                          AccessibilityEvent
                              .TYPE_WINDOW_STATE_CHANGED &&
                      type !=
                          AccessibilityEvent
                              .TYPE_VIEW_TEXT_CHANGED) {
                      return;
                  }

                  handler.removeCallbacksAndMessages(null);

                  handler.postDelayed(
                      this::checkScreen,
                      300
                  );
              }

              private void checkScreen() {
                  if (prefs == null ||
                      !prefs.getBoolean(
                          "enabled",
                          false
                      )) {
                      return;
                  }

                  AccessibilityNodeInfo root =
                      getRootInActiveWindow();

                  if (root == null) {
                      return;
                  }

                  String screenText =
                      collectText(root);

                  if (screenText.trim().isEmpty()) {
                      root.recycle();
                      return;
                  }

                  int count = prefs.getInt(
                      "rule_count",
                      0
                  );

                  for (int i = 0; i < count; i++) {

                      if (!prefs.getBoolean(
                          "rule_enabled_" + i,
                          true
                      )) {
                          continue;
                      }

                      String keyword =
                          prefs.getString(
                              "keyword_" + i,
                              ""
                          ).trim();

                      String response =
                          prefs.getString(
                              "response_" + i,
                              ""
                          ).trim();

                      if (keyword.isEmpty() ||
                          response.isEmpty()) {
                          continue;
                      }

                      String lower =
                          screenText.toLowerCase(
                              Locale.ROOT
                          );

                      if (!lower.contains(
                          keyword.toLowerCase(
                              Locale.ROOT
                          )
                      )) {
                          continue;
                      }

                      if (screenText.equals(
                          lastScreenText
                      )) {
                          continue;
                      }

                      long now =
                          System.currentTimeMillis();

                      int delay =
                          prefs.getInt(
                              "delay",
                              5
                          );

                      if (now - lastReplyTime <
                          delay * 1000L) {
                          continue;
                      }

                      lastScreenText =
                          screenText;

                      lastReplyTime = now;

                      root.recycle();

                      reply(response);

                      return;
                  }

                  root.recycle();
              }

              private String collectText(
                  AccessibilityNodeInfo node
              ) {

                  if (node == null) {
                      return "";
                  }

                  StringBuilder result =
                      new StringBuilder();

                  CharSequence text =
                      node.getText();

                  if (text != null) {
                      result.append(text)
                          .append(" ");
                  }

                  CharSequence description =
                      node.getContentDescription();

                  if (description != null) {
                      result.append(description)
                          .append(" ");
                  }

                  for (int i = 0;
                       i < node.getChildCount();
                       i++) {

                      AccessibilityNodeInfo child =
                          node.getChild(i);

                      if (child != null) {
                          result.append(
                              collectText(child)
                          );

                          child.recycle();
                      }
                  }

                  return result.toString();
              }

              private void reply(String response) {

                  AccessibilityNodeInfo root =
                      getRootInActiveWindow();

                  if (root == null) {
                      return;
                  }

                  AccessibilityNodeInfo input =
                      findInput(root);

                  if (input == null) {
                      root.recycle();
                      return;
                  }

                  Bundle args =
                      new Bundle();

                  args.putCharSequence(
                      AccessibilityNodeInfo
                          .ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE,
                      response
                  );

                  boolean success =
                      input.performAction(
                          AccessibilityNodeInfo
                              .ACTION_SET_TEXT,
                          args
                      );

                  input.recycle();
                  root.recycle();

                  if (!success) {
                      return;
                  }

                  handler.postDelayed(
                      () -> {
                          AccessibilityNodeInfo
                              newRoot =
                              getRootInActiveWindow();

                          if (newRoot != null) {
                              clickSendButton(
                                  newRoot
                              );
                          }
                      },
                      500
                  );
              }

              private AccessibilityNodeInfo findInput(
                  AccessibilityNodeInfo node
              ) {

                  if (node == null) {
                      return null;
                  }

                  CharSequence className =
                      node.getClassName();

                  if (className != null &&
                      className.toString()
                          .contains("EditText") &&
                      node.isEditable() &&
                      node.isEnabled()) {

                      return node;
                  }

                  for (int i = 0;
                       i < node.getChildCount();
                       i++) {

                      AccessibilityNodeInfo child =
                          node.getChild(i);

                      AccessibilityNodeInfo result =
                          findInput(child);

                      if (result != null) {
                          return result;
                      }

                      if (child != null) {
                          child.recycle();
                      }
                  }

                  return null;
              }

              private void clickSendButton(
                  AccessibilityNodeInfo root
              ) {

                  List<AccessibilityNodeInfo>
                      buttons =
                      new ArrayList<>();

                  findButtons(
                      root,
                      buttons
                  );

                  for (
                      AccessibilityNodeInfo button :
                      buttons
                  ) {

                      String value = "";

                      CharSequence text =
                          button.getText();

                      CharSequence description =
                          button.getContentDescription();

                      if (text != null) {
                          value += text;
                      }

                      if (description != null) {
                          value += " " +
                              description;
                      }

                      value = value.toLowerCase(
                          Locale.ROOT
                      );

                      if (
                          value.contains("enviar") ||
                          value.contains("send") ||
                          value.contains("mandar")
                      ) {

                          if (button.isEnabled()) {
                              button.performAction(
                                  AccessibilityNodeInfo
                                      .ACTION_CLICK
                              );

                              button.recycle();
                              break;
                          }
                      }

                      button.recycle();
                  }

                  root.recycle();
              }

              private void findButtons(
                  AccessibilityNodeInfo node,
                  List<AccessibilityNodeInfo> list
              ) {

                  if (node == null) {
                      return;
                  }

                  CharSequence className =
                      node.getClassName();

                  if (className != null &&
                      className.toString()
                          .contains("Button")) {

                      list.add(
                          AccessibilityNodeInfo
                              .obtain(node)
                      );
                  }

                  for (int i = 0;
                       i < node.getChildCount();
                       i++) {

                      AccessibilityNodeInfo child =
                          node.getChild(i);

                      if (child != null) {
                          findButtons(
                              child,
                              list
                          );

                          child.recycle();
                      }
                  }
              }

              @Override
              public void onInterrupt() {
              }

              @Override
              public void onDestroy() {
                  handler.removeCallbacksAndMessages(
                      null
                  );

                  super.onDestroy();
              }
          }
          EOF

          echo "Projeto Android criado com sucesso."

      - name: Baixar Gradle
        shell: bash
        run: |
          set -e

          cd "$RUNNER_TEMP"

          wget -q \
            https://services.gradle.org/distributions/gradle-8.10.2-bin.zip

          unzip -q gradle-8.10.2-bin.zip

          echo "$RUNNER_TEMP/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Verificar ambiente
        shell: bash
        run: |
          set -e

          java -version
          gradle --version
          sdkmanager --version

      - name: Compilar APK
        shell: bash
        run: |
          set -e

          gradle \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Conferir APK
        shell: bash
        run: |
          set -e

          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "ERRO: o APK não foi criado."
            exit 1
          fi

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            APK/Automensagen.apk

          ls -lh APK/Automensagen.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Automensagen-APK
          path: APK/Automensagen.apk
          if-no-files-found: error
